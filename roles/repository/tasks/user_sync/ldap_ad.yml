---
- name: Merge the LDAP-AD settings with their defaults
  no_log: true
  ansible.builtin.set_fact:
    repository_ldap_ad: >-
      {{ repository_ldap_ad_defaults
      | ansible.builtin.combine(repository_user_sync_ldap_ad
      | dict2items | rejectattr('value', 'none') | items2dict) }}

- name: Create the LDAP-AD subsystem directory
  become: true
  ansible.builtin.file:
    path: "{{ repository_subsystems_dir }}/ldap-ad/{{ repository_ldap_ad.instance_name }}"
    state: directory
    owner: "{{ repository_username }}"
    group: "{{ repository_group }}"
    mode: "0750"

- name: Write the LDAP-AD synchronization properties
  become: true
  no_log: true
  diff: false
  ansible.builtin.template:
    src: ldap-ad-authentication.properties.j2
    dest: >-
      {{ repository_subsystems_dir }}/ldap-ad/{{ repository_ldap_ad.instance_name }}/ldap-ad-authentication.properties
    owner: "{{ repository_username }}"
    group: "{{ repository_group }}"
    mode: "0640"
  notify: repository-needs-restart
