---
driver:
  name: docker
platforms:
  - name: systemd-instance
    image: ${MOLECULE_ROLE_IMAGE:-rockylinux/rockylinux:9}
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
provisioner:
  name: ansible
  config_options:
    defaults:
      pipelining: true
  inventory:
    host_vars:
      instance:
        ansible_user: ansible
