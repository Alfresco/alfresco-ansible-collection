---
- name: Ensure repository OAuth variables are set when auth type is not basic
  ansible.builtin.assert:
    that:
      - cic_connector_alfresco_client_id | length > 0
      - cic_connector_alfresco_client_secret | length > 0
      - cic_connector_alfresco_token_url | length > 0
    fail_msg: >-
      cic_connector_alfresco_client_id, cic_connector_alfresco_client_secret and
      cic_connector_alfresco_token_url must be set when cic_connector_alfresco_auth_type is not "basic"
    quiet: true
  when: cic_connector_alfresco_auth_type != "basic"

- name: Fetch Live Ingester artifact for version {{ cic_connector_live_ingester_artifact_version }}
  become: true
  become_user: "{{ cic_connector_service_user }}"
  ansible.builtin.get_url:
    url: "{{ cic_connector_live_ingester_artifact_url }}"
    dest: "{{ cic_connector_live_ingester_artifact_path }}"
    url_username: "{{ cic_connector_artifact_username }}"
    url_password: "{{ cic_connector_artifact_password }}"
    mode: "0600"

- name: Set environments specific for Live Ingester
  ansible.builtin.set_fact:
    cic_connector_live_ingester_environment:
      HYLANDEXPERIENCE_INSIGHT_INGESTION_BASEURL: "{{ cic_connector_remote_ingestion_url }}"
      ALFRESCO_TRANSFORM_SHAREDFILESTORE_BASEURL: "{{ cic_connector_alfresco_sfs_url }}"
      SERVER_PORT: "{{ cic_connector_live_ingester_port }}"
      APPLICATION_SOURCEID: "{{ cic_connector_application_sourceid }}"

- name: Install Live Ingester
  ansible.builtin.include_role:
    name: alfresco.platform.systemd_service
    apply:
      become: true
  vars:
    systemd_service_unit_name: "alfresco-cic-connector-live-ingester"
    systemd_service_unit_description: "Alfresco Content Intelligence Connector Live Ingester"
    systemd_service_exec_start: "{{ cic_connector_java_bin_path }} -jar {{ cic_connector_live_ingester_artifact_path }}"
    systemd_service_user: "{{ cic_connector_service_user }}"
    systemd_service_environment: >-
      {{ cic_connector_base_environment |
      combine(cic_connector_remote_client_environment) |
      combine(cic_connector_alfresco_oauth_environment) |
      combine(cic_connector_live_ingester_reliability_environment) |
      combine(cic_connector_live_ingester_environment) }}
