---
- name: Verify
  hosts: cic-instance
  gather_facts: false
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Check expected services are present
      ansible.builtin.assert:
        that:
          - "'alfresco-cic-connector-live-ingester.service' in ansible_facts.services"
          - ansible_facts.services['alfresco-cic-connector-live-ingester.service'].state == 'running'
          - "'alfresco-cic-connector-nucleus-sync.service' in ansible_facts.services"
          - ansible_facts.services['alfresco-cic-connector-nucleus-sync.service'].state == 'running'
          - "'alfresco-cic-connector-bulk-ingester.service' in ansible_facts.services"
          - ansible_facts.services['alfresco-cic-connector-bulk-ingester.service'].state != 'running'

    - name: Ensure live-ingester service is running
      ansible.builtin.systemd:
        name: alfresco-cic-connector-live-ingester
        state: started
      register: cic_connector_live_ingester_svc

    - name: Check live ingester reliability env vars are set
      become: true
      changed_when: false
      ansible.builtin.command:
        cmd: >-
          grep -q '{{ item }}'
          /proc/{{ cic_connector_live_ingester_svc.status.ExecMainPID }}/environ
      loop:
        - 'ALFRESCO_TRANSFORM_RESPONSE_QUEUENAME=org.alfresco.cic-connector.transform.response'
        - 'ALFRESCO_REPOSITORY_EVENTSSUBSCRIPTION_DURABLE=true'
        - 'ALFRESCO_TRANSFORM_RESPONSE_DEADLETTERENABLED=true'
        - 'CAMEL_COMPONENT_ACTIVEMQ_TRANSACTED=true'

    - name: Ensure the ActiveMQ broker is reachable from the connector host
      ansible.builtin.wait_for:
        host: activemq-instance
        port: 61616
        timeout: 60

    - name: Check the live-ingester liveness probe is UP
      ansible.builtin.uri:
        url: "http://localhost:8080/actuator/health/liveness"
        status_code: 200
      register: cic_connector_liveness_probe
      until: cic_connector_liveness_probe.status == 200
      retries: 12
      delay: 10

    - name: Check the live-ingester readiness probe reaches UP
      ansible.builtin.uri:
        url: "http://localhost:8080/actuator/health/readiness"
        status_code: 200
      register: cic_connector_readiness_probe
      until: cic_connector_readiness_probe.status == 200
      retries: 24
      delay: 10

    - name: Confirm the aggregate health endpoint is UP
      ansible.builtin.uri:
        url: "http://localhost:8080/actuator/health"
        status_code: 200
      register: cic_connector_health_probe
      changed_when: false

    - name: Show live-ingester health status
      ansible.builtin.debug:
        msg: >-
          live-ingester /actuator/health -> HTTP {{ cic_connector_health_probe.status }},
          status={{ cic_connector_health_probe.json.status | default('n/a') }}

    - name: Ensure bulk-ingester service is not running
      ansible.builtin.systemd:
        name: alfresco-cic-connector-bulk-ingester
      register: cic_connector_bulk_ingester_svc

    - name: Check bulk-ingester is installed but stopped and disabled
      ansible.builtin.assert:
        that:
          - cic_connector_bulk_ingester_svc.status.ActiveState != 'active'
          - cic_connector_bulk_ingester_svc.status.UnitFileState == 'disabled'
        quiet: true
