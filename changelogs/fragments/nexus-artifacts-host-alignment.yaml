minor_changes:
  - audit_storage, search_community, cic_connector - default the Nexus
    artifact host to ``artifacts.alfresco.com``, matching every other role's
    production URL, and add ``audit_storage_repository`` so downstream
    playbooks can override just the repository base instead of the full
    ``audit_storage_zip_url``.
  - cic_connector - move the ``org/alfresco`` path segment into
    ``cic_connector_artifact_repository_url`` itself, so the variable can be
    overridden with any repository style base URL without producing a
    duplicated path.
  - search_community - default ``search_community_repository_url`` to the
    ``/nexus/repository/releases/`` path instead of the legacy Nexus 2 style
    ``/nexus/content/repositories/releases/``.
breaking_changes:
  - search_community - renamed ``search_community_repository`` to
    ``search_community_repository_url``, matching ``cic_connector``'s
    ``_url`` suffix convention. Playbooks overriding the old variable
    name must be updated.
  - cic_connector - ``cic_connector_artifact_repository_url`` no longer
    requires (or produces) a trailing slash; the role now inserts the
    ``/`` itself between the repository base and each artifact path,
    matching ``audit_storage`` and ``search_community``. Overrides that
    supplied their own trailing slash will end up with a doubled ``//``.
