minor_changes:
  - audit_storage, search_community, cic_connector - default the Nexus
    artifact host to ``artifacts.alfresco.com``, matching every other role's
    production URL, and add ``audit_storage_repository_url`` so downstream
    playbooks can override just the repository base instead of the full
    ``audit_storage_zip_url``.
  - cic_connector - move the ``org/alfresco`` path segment into
    ``cic_connector_artifact_repository_url`` itself, so the variable can be
    overridden with any repository style base URL without producing a
    duplicated path. A trailing slash on the override, previously
    required, is now optional and stripped automatically, so existing
    overrides keep working unchanged.
  - search_community - default ``search_community_repository_url`` to the
    ``/nexus/repository/releases/`` path instead of the legacy Nexus 2 style
    ``/nexus/content/repositories/releases/``.
deprecated_features:
  - search_community - ``search_community_repository`` is deprecated in
    favor of ``search_community_repository_url``, matching
    ``cic_connector``'s ``_url`` suffix convention. The old variable name
    is still honored as a fallback and will be removed in a future major
    release.
