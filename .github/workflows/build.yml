name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PY_COLORS: 1
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    name: Galaxy build
    needs:
      - pre-commit
      - sanity
      - molecule
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: galaxy build
        run: |
          uv run ansible-galaxy collection build

      - name: galaxy publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          uv run ansible-galaxy collection publish
          alfresco-platform-${GITHUB_REF#refs/tags/v}.tar.gz
          --token "${{ secrets.ANSIBLE_GALAXY_API_KEY }}"

  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.26.0
        with:
          skip_checkout: true

  sanity:
    runs-on: ubuntu-latest
    name: Sanity against Ⓐ ${{ matrix.ansible }}
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.16
          - stable-2.17
          - stable-2.18
    steps:
      - name: Perform sanity testing
        # See the documentation for the following GitHub action on
        # https://github.com/ansible-community/ansible-test-gh-action/blob/main/README.md
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity
          coverage: never # codecov integration required

  molecule:
    runs-on: ubuntu-latest
    name: Molecule against ${{ matrix.roles.role_name }} role
    strategy:
      fail-fast: false
      matrix:
        roles:
          - role_name: java
          - role_name: systemd_service
          - role_name: cic_connector
          - role_name: audit_storage
          - role_name: search_community
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Disable unix-chkpwd AppArmor profile
        run: |
          if sudo aa-status --enabled 2>/dev/null; then
            sudo ln -sf /etc/apparmor.d/unix-chkpwd /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd 2>/dev/null || true
          fi

      - name: Run molecule
        env:
          ANSIBLE_DIFF_ALWAYS: "true"
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        working-directory: roles/${{ matrix.roles.role_name }}
        run: |
          uv run molecule test
