name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PY_COLORS: 1
  PYTHONUNBUFFERED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    name: Galaxy build
    needs:
      - pre-commit
      - sanity
      - molecule
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: galaxy build
        run: |
          uv run ansible-galaxy collection build

      - name: galaxy publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          uv run ansible-galaxy collection publish
          alfresco-platform-${GITHUB_REF#refs/tags/v}.tar.gz
          --token "${{ secrets.ANSIBLE_GALAXY_API_KEY }}"

  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v19.1.1
        with:
          skip_checkout: true

  sanity:
    runs-on: ubuntu-latest
    name: Sanity against Ⓐ ${{ matrix.ansible }}
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.16
          - stable-2.17
          - stable-2.18
    steps:
      - name: Perform sanity testing
        # See the documentation for the following GitHub action on
        # https://github.com/ansible-community/ansible-test-gh-action/blob/main/README.md
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity
          coverage: never # codecov integration required

  molecule-matrix:
    runs-on: ubuntu-latest
    name: Build roles/scenario matrix
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the molecule scenarios of every role
        id: set-matrix
        run: |
          MATRIX=$(find roles -mindepth 4 -maxdepth 4 -path 'roles/*/molecule/*/molecule.yml' | sort \
            | jq -Rnc '[inputs | split("/") | {role: .[1], scenario: .[3]}]')
          if [ "$MATRIX" = "[]" ]; then
            echo "::error::No molecule scenario found in roles/*/molecule/*/molecule.yml"
            exit 1
          fi
          echo "Computed matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  molecule:
    runs-on: ubuntu-latest
    name: Molecule against ${{ matrix.role }} role (${{ matrix.scenario }})
    needs: molecule-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.molecule-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Disable unix-chkpwd AppArmor profile
        run: |
          if sudo aa-status --enabled 2>/dev/null; then
            sudo ln -sf /etc/apparmor.d/unix-chkpwd /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd 2>/dev/null || true
          fi

      - name: Run molecule
        env:
          ANSIBLE_DIFF_ALWAYS: "true"
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        working-directory: roles/${{ matrix.role }}
        run: |
          uv run molecule test -s "$MOLECULE_SCENARIO"
